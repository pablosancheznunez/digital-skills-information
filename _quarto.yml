project:
  type: book
  output-dir: _book
  resources:
    - laboratorio.js
    - fuentes
    - datos
    - webr
    - webr-repo
    - plantillas
    - pdf
    - moodle
    - sw.js

book:
  title: "Digital Skills for Information Use"
  subtitle: "An interactive guide · Bachelor's degree (Transversal Training)"
  author:
    - name: "Pablo Sánchez-Núñez"
      orcid: 0000-0001-7845-9506
      url: https://pablosancheznunez.com
      affiliation: "Universidad Carlos III de Madrid"
  date: last-modified
  date-format: "D MMMM YYYY"
  language: en
  site-url: https://pablosancheznunez.com/digital-skills-information/
  doi: 10.5281/zenodo.XXXXXXXX
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: download
        menu:
          - text: "Book (PDF)"
            href: pdf/digital-skills-information.pdf
          - text: "Book (EPUB, for e-readers)"
            href: pdf/digital-skills-information.epub
  page-footer:
    left: "© 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Text licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    right: "Universidad Carlos III de Madrid · Made with [Quarto](https://quarto.org) y [webR](https://docs.r-wasm.org/webr/latest/)"
  chapters:
    - index.qmd
    - 00-r-in-this-book.qmd
    - part: "Units"
      chapters:
        - 01-sources.qmd
        - 02-retrieval.qmd
        - 03-ethics-plagiarism.qmd
        - 04-references.qmd
        - 05-ai-foundations.qmd
        - 06-ai-ethics.qmd
  appendices:
    - 90-citations.qmd
    - 93-checklists.qmd
    - 94-verification.qmd
    - 91-teaching-guide.qmd
    - 92-glossary.qmd

lang: en

crossref:
  chapters: false

filters:
  - webex
  - interactivos
  - glosario.lua

format:
  live-html:
    theme:
      light: [cosmo, estilos.scss]
      dark: [darkly, estilos-oscuro.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    css: fuentes/fuentes.css
    lightbox: auto
    footnotes-hover: true
    reference-location: margin
    link-external-newwindow: true
    callout-appearance: simple
    include-in-header:
      - laboratorio.html
    include-after-body:
      - accesibilidad.html
      - progreso.html

webr:
  engine-url: webr/
  repos:
    - webr-repo
  resources:
    - datos
